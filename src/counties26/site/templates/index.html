<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>County Championships 2026 | Live standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell landing">
  <p class="eyebrow">County Championships / 2026</p>
  <h1>Every frame.<br><em>Every result.</em></h1>
  <p class="intro">Live tournament standings, player averages, match breakdowns and lane draws.</p>
  <div class="division-links">
    {% for division, title in divisions.items() %}
    <a class="division-link" href="{{ division }}.html">
      <span>{{ title }} competition</span><strong>View standings <span aria-hidden="true">-&gt;</span></strong>
    </a>
    {% endfor %}
  </div>
  <p class="generated">Updated {{ generated_at }}</p>
</main>
</body>
</html>
