[project]
name = "counties26"
version = "0.1.0"
description = "Scoring tool for the 2026 County Championships bowling tournament"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
counties26 = "counties26.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counties26"]
